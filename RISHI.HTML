<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RISHI AI</title>
    <link rel="stylesheet" href="r.css">

</head>

<body>

    <h1>R.I.S.H.I</h1>

    <div id="circle">
        RISHI
    </div>

    <button onclick="startRISHI()">🎤 Speak</button>

    <div id="output">
        Click the button and speak...
    </div>


    <script>

        const output = document.getElementById("output");

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition;

        if (SpeechRecognition) {

            recognition = new SpeechRecognition();

            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "en-IN";

        } else {

            output.innerHTML =
                "Speech recognition is not supported in this browser.";

        }


        function speak(text) {

            output.innerHTML = "RISHI: " + text;

            const speech = new SpeechSynthesisUtterance(text);

            speech.lang = "en-IN";
            speech.rate = 1;
            speech.pitch = 1;

            window.speechSynthesis.speak(speech);
        }


        function startRISHI() {

            if (!recognition) {
                speak("Speech recognition is not supported.");
                return;
            }

            output.innerHTML = "🎤 Listening...";

            recognition.start();
        }


        recognition.onresult = function (event) {

            const command =
                event.results[0][0].transcript.toLowerCase();

            output.innerHTML = "You: " + command;

            runCommand(command);
        };


        recognition.onerror = function (event) {

            output.innerHTML =
                "Error: " + event.error;

        };


        function runCommand(command) {

           //  Hello
            if (
                command.includes("hello") ||
                command.includes("hi")
            ) {

                speak("Hello SIR. I AM RISHI, How can I help you?");

            }


          //   Time
            else if (command.includes("time")) {

                const time =
                    new Date().toLocaleTimeString();

                speak("The current time is " + time);

            }


           //  Date
            else if (command.includes("date")) {

                const date =
                    new Date().toLocaleDateString();

                speak("Today's date is " + date);

            }


           //  YouTube
            else if (
                command.includes("youtube") ||
                command.includes("open youtube")
            ) {

                speak("Opening YouTube");

                window.open(
                    "https:www.youtube.com",
                    "_blank"
                );

            }


           //  Google
            else if (
                command.includes("google") ||
                command.includes("open google")
            ) {

                speak("Opening Google");

                window.open(
                    "https:www.google.com",
                    "_blank"
                );

            }


            // Search
            else if (command.includes("search")) {

                let search =
                    command.replace("search", "").trim();

                if (search === "") {

                    speak("What should I search?");

                } else {

                    speak("Searching for " + search);

                    window.open(
                        "https:www.google.com/search?q=" +
                        encodeURIComponent(search),
                        "_blank"
                    );

                }

            }
             else if (command.includes("play")) {
                 let search = command.replace("play", "").trim();

               if (search === "") {
                     speak("what should i play sir");
                }
                else{
                    speak("some results for " + search);

                    window.open(
                        "https:www.youtube.com/search?q="+
                        encodeURIComponent(search),
                        "_blank"
                   );
               }
            } 


            // Instagram
            else if (command.includes("instagram")) {

                speak("Opening Instagram");

                window.open(
                    "https:www.instagram.com",
                    "_blank"
                );

            }


            // Calculator
            else if (command.includes("calculator")) {

                speak("Opening calculator");

                window.open(
                    "https:www.google.com/search?q=calculator",
                    "_blank"
                );

            }


            // Who are you
            else if (
                command.includes("who are you") ||
                command.includes("your name")
            ) {

                speak(
                    "I am RISHI, your personal virtual assistant."
                );

            }
           // facebook
            else if (command.includes("facebook")) {

                speak("Opening facebook");

                window.open(
                    "https:www.facebook.com/",
                    "_blank"
                );

            }
            else if (
                command.includes("play my favrourite ssong")||
                command.includes("song")
            ) {
                speak(
                    "playing tera hone laga hu"
                );
                window.open(
                    " https:youtu.be/rTuxUAuJRyY?si=5zltPjmZDHuE6Cpj",
                    "_blank"
                );
            }
            else if (
                command.include("how are you rishi") ||
                command.includes("kaise ho rishi")
            ) {
                speak(
                    "i am fine, you say."
                );
            }


           //  Stop
            else if (
                command.includes("stop") ||
                command.includes("bye")
            ) {

                speak("thankyou for using me.");

            }
            else if (
                command.includes("what you do") ||
                command.includes("what can you do")
            ) {

                speak("I can do many things.");

            }

           //  Unknown

            else {

                speak(
                    "Sorry sir, I don't understand ."
                );

            }

        }

    </script>

</body>

</html>
